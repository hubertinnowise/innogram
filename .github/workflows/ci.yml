name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx nx run-many --target=lint --projects=frontend,backend

      - name: Type Check
        run: npx tsc --noEmit

      - name: Test
        run: npx nx run-many --target=test --projects=frontend,backend --parallel

      - name: Build backend Dockerfile
        run: docker build -t backend ./backend

      - name: Build frontend Dockerfile
        run: docker build -t frontend ./frontend

      - name: Validate docker-compose
        run: docker-compose config
