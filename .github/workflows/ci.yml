name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint frontend and backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Lint frontend
        run: npx nx lint frontend
      - name: Lint backend
        run: npx nx lint backend

  typecheck:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Type check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json
      - name: Type check backend
        run: npx tsc --noEmit --project backend/tsconfig.app.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Test frontend
        run: npx nx test frontend
      - name: Test backend
        run: |
          echo "::notice::Running backend test (if configured)"
          npx nx test backend || echo "::warning::No test executor defined for backend"

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile . --tag frontend-ci
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile . --tag backend-ci
