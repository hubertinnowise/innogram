name: Lint NX
description: Lint NX

runs:
    using: 'composite'
    steps:
        - name: Setup node base
          uses: ./.github/workflows/utils/setup-node

        - name: Install dependencies
          uses: ./.github/workflows/modules/nx/install-dependencies

        - name: Get nx env
          uses: ./.github/workflows/utils/get-nx-env

        - name: Lint and fix
          shell: bash
          run: |
              pnpm nx format:write --all
              pnpm nx run-many --all --target=lint --fix
              pnpm nx run-many --all --target=build --noEmitOnError
