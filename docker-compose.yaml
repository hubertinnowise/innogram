services:
    postgres:
        image: postgres
        ports:
            - 5454:5432
        volumes:
            - pgdata:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: db
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d db']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 4G

volumes:
    pgdata:
