version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: npx nx serve backend --configuration=development

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npx nx serve frontend --configuration=development
    depends_on:
      - backend
